<html lang="uk">
<head>

    <title>MyKep - Розклад</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#110c0a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body class="page-schedule">
    <div class="app-container">
        <header class="header">
            <h1 style="font-weight: 500; font-size: 24px; letter-spacing: -0.5px;">MyKep</h1>
            <div class="location-pill" style="background: rgba(255,255,255,0.04); padding: 6px 12px; border-radius: 20px; color: #8b8079; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <!-- Саме сюди JS тепер впише "Х-й тиждень" -->
                <span id="header-group-text">Завантаження...</span>
            </div>
        </header>

        <div class="day-picker">
            <!-- Заповнюється через JS -->
        </div>

        <main class="schedule-main">
            <div class="schedule-list" id="dynamic-schedule-list">
                <!-- Заповнюється через JS -->
            </div>
        </main>

        <nav class="bottom-nav">
            <!-- На цій сторінці активна ліва кнопка (календар) -->
            <button class="nav-btn center-action" onclick="window.location.href='schedule.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
            <button class="nav-btn" onclick="window.location.href='index.html'"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
            <button class="nav-btn" onclick="window.location.href='settings.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>

    <script src="js/api.js"></script>

    <script src="js/schedule.js"></script>

    <script src="js/app.js"></script>

</html>
