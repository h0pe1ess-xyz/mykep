name: Checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/benchmark_core.py
      - run: python scripts/release.py --check
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
  frontend:
    name: Frontend and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
